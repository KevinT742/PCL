name: 自动同步上游并打包

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest    # ⚠️ 关键：必须用 Windows 构建机

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # 拉取上游最新代码
      - name: 备份自定义文件
        run: |
          mkdir _backup
          Copy-Item -Recurse -Force .patches _backup/
          Copy-Item -Recurse -Force .github _backup/



      - name: 拉取上游更新
        run: |
          git remote add upstream https://github.com/Meloong-Git/PCL.git
          git fetch upstream
          git reset --hard upstream/main


      - name: 确认补丁存在
        run: |
          if (-not (Test-Path ".patches")) {
            Write-Host "❌ .patches 不存在，仓库状态异常"
            Get-ChildItem -Force
            exit 1
          }
          Get-ChildItem .patches



      # 应用你的补丁
      - name: 应用补丁
        run: |
          foreach ($patch in Get-ChildItem .patches/AllowMcDownload.patch) {
            git apply $patch.FullName
          }

      - name: 还原自定义文件
        run: |
          Copy-Item -Recurse -Force _backup/.patches ./
          Copy-Item -Recurse -Force _backup/.github ./
          Remove-Item -Recurse -Force _backup


      # 提交同步后的代码
      - name: 提交
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "bot@github.com"
          git add -A
          git commit -m "同步上游并应用补丁" || echo "没有变化"
          git push origin main --force

      # 恢复 NuGet 依赖（PCL 项目需要）
      - name: 还原 NuGet 包
        uses: NuGet/setup-nuget@v2

      - name: NuGet restore
        run: nuget restore Plain Craft Launcher 2.sln

      # 用 MSBuild 编译
      - name: 编译
        uses: microsoft/setup-msbuild@v2

      - name: MSBuild
        run: msbuild "Plain Craft Launcher 2.sln" /p:Configuration=Release /p:Platform="Any CPU"

      # 上传构建产物，方便调试（可选但推荐）
      - name: 上传构建产物（调试用）
        uses: actions/upload-artifact@v4
        with:
          name: PCL2-output
          path: |
            Plain Craft Launcher 2/bin/Release/*.exe
            Plain Craft Launcher 2/bin/Release/*.dll

      # 发布 Release
      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 自动构建 #${{ github.run_number }}
          files: Plain Craft Launcher 2/bin/Release/*.exe
