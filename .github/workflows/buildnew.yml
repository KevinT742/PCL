name: 自动同步上游并打包

on:
  schedule:
    - cron: '0 3 * * *' 
  workflow_dispatch:

permissions:
  contents: write



jobs:
  build:
    runs-on: windows-latest    # ⚠️ 关键：必须用 Windows 构建机

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # 拉取上游最新代码
      - name: 备份自定义文件
        run: |
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\bak" | Out-Null
          Copy-Item ".patches" "$env:RUNNER_TEMP\bak\" -Recurse -Force
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\bak\wf" | Out-Null
          Copy-Item ".github\workflows\buildnew.yml" "$env:RUNNER_TEMP\bak\wf\" -Force







      - name: 还原自定义文件
        run: |
          # 还原补丁
          Copy-Item "$env:RUNNER_TEMP\bak\.patches" ".\" -Recurse -Force
          # 还原工作流（路径和备份步骤一致：\bak\wf\）
          New-Item -ItemType Directory -Force -Path ".github\workflows" | Out-Null
          Copy-Item "$env:RUNNER_TEMP\bak\wf\buildnew.yml" ".github\workflows\" -Force
          Write-Host "还原完成，验证："
          Test-Path ".patches"
          Test-Path ".github\workflows\buildnew.yml"


      - name: 自检
        run: |
          if (-not (Test-Path ".patches")) { Write-Host "❌ .patches 丢失"; exit 1 }
          if (-not (Test-Path ".github\workflows\buildnew.yml")) { Write-Host "❌ 我的工作流丢失"; exit 1 }
          Write-Host "✅ 自定义文件全部就位"



      # 应用你的补丁
      - name: 应用补丁
        run: git apply .patches/AllowMcDownload.patch

      - name: 提交并推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 只保留补丁文件，其他还原出来的东西不进提交
          git add .patches
          git reset -- .github "Plain Craft Launcher 2"   # 把误暂存的撤下来（保险起见）
          git checkout -- "Plain Craft Launcher 2" 2>$null # 丢弃补丁对源码的改动（补丁文件本身已保存）

          # 删掉还原出来的工作流文件，避免被 add 进去
          Remove-Item ".github\workflows\buildnew.yml" -Force -ErrorAction SilentlyContinue
          Remove-Item ".github\workflows\build.yml" -Force -ErrorAction SilentlyContinue
          Remove-Item ".github\workflows\build.yml.disabled" -Force -ErrorAction SilentlyContinue

          git commit -m "同步上游并应用补丁" || echo "没有变化"
          git push origin main --force


      # 恢复 NuGet 依赖（PCL 项目需要）
      - name: 还原 NuGet 包
        uses: NuGet/setup-nuget@v2

      - name: NuGet restore
        run: nuget restore "Plain Craft Launcher 2.sln"

      # 用 MSBuild 编译
      - name: 编译
        uses: microsoft/setup-msbuild@v2

      - name: MSBuild
        run: |
          $msbuild = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest -requires Microsoft.Component.MSBuild -find MSBuild\**\Bin\MSBuild.exe | Select-Object -First 1
          & $msbuild "Plain Craft Launcher 2.sln" -p:Configuration=Release -restore -m


      # 上传构建产物，方便调试（可选但推荐）
      - name: 上传构建产物（调试用）
        uses: actions/upload-artifact@v4
        with:
          name: PCL2-output
          path: |
            Plain Craft Launcher 2/bin/Release/*.exe
            Plain Craft Launcher 2/bin/Release/*.dll

      - name: 查找输出文件
        run: |
          Get-ChildItem -Recurse -Filter "*.exe" | Where-Object { $_.FullName -notmatch "obj\\" } | Select-Object FullName
          Get-ChildItem -Recurse -Directory -Filter "Release" | Select-Object FullName



      - name: 打包
        run: |
          $outDir = "Plain Craft Launcher 2\bin"
          if (-not (Test-Path "$outDir\Plain Craft Launcher 2.exe")) {
            Write-Host "❌ 找不到 exe"
            exit 1
          }
          $ver = git rev-parse --short HEAD
          echo "VERSION=$ver" >> $env:GITHUB_ENV
          Compress-Archive -Path "Plain Craft Launcher 2\bin\Plain Craft Launcher 2.exe" `
            -DestinationPath "PCL2-$ver.zip" -Force


      - name: 发布到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: auto-${{ env.VERSION }}
          name: 自动构建 ${{ env.VERSION }}
          files: PCL2-${{ env.VERSION }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

