name: 自动同步上游并打包

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write


jobs:
  build:
    runs-on: windows-latest    # ⚠️ 关键：必须用 Windows 构建机

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # 拉取上游最新代码
      - name: 备份自定义文件
        run: |
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\bak" | Out-Null
          Copy-Item ".patches" "$env:RUNNER_TEMP\bak\" -Recurse -Force
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\bak\wf" | Out-Null
          Copy-Item ".github\workflows\buildnew.yml" "$env:RUNNER_TEMP\bak\wf\" -Force




      - name: 拉取上游更新
        run: |
          git remote add upstream https://github.com/Meloong-Git/PCL.git
          git fetch upstream
          git reset --hard upstream/main





      - name: 还原自定义文件
        run: |
          # 只还原你自己的工作流和补丁，不动上游的 .github 其他文件
          Copy-Item "$env:RUNNER_TEMP\bak\.patches" ".\" -Recurse -Force
          # 精确还原你自己的工作流文件，而不是整个 .github
          New-Item -ItemType Directory -Force -Path ".github\workflows" | Out-Null
          Copy-Item "$env:RUNNER_TEMP\bak\.github\workflows\buildnew.yml" ".github\workflows\" -Force

      - name: 自检
        run: |
          if (-not (Test-Path ".patches")) { Write-Host "❌ .patches 丢失"; exit 1 }
          if (-not (Test-Path ".github\workflows\buildnew.yml")) { Write-Host "❌ 我的工作流丢失"; exit 1 }
          Write-Host "✅ 自定义文件全部就位"



      # 应用你的补丁
      - name: 应用补丁
        run: |
          foreach ($patch in Get-ChildItem .patches/AllowMcDownload.patch) {
            git apply $patch.FullName
          }


      - name: 确认补丁存在
        run: |
          if (-not (Test-Path ".patches")) {
            Write-Host "❌ .patches 不存在，仓库状态异常"
            Get-ChildItem -Force
          }
          Get-ChildItem .patches


      # 提交同步后的代码
      - name: 提交
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "bot@github.com"
          git add -A
          git commit -m "同步上游并应用补丁" || echo "没有变化"
          git push origin main --force

      # 恢复 NuGet 依赖（PCL 项目需要）
      - name: 还原 NuGet 包
        uses: NuGet/setup-nuget@v2

      - name: NuGet restore
        run: nuget restore Plain Craft Launcher 2.sln

      # 用 MSBuild 编译
      - name: 编译
        uses: microsoft/setup-msbuild@v2

      - name: MSBuild
        run: msbuild "Plain Craft Launcher 2.sln" /p:Configuration=Release /p:Platform="Any CPU"

      # 上传构建产物，方便调试（可选但推荐）
      - name: 上传构建产物（调试用）
        uses: actions/upload-artifact@v4
        with:
          name: PCL2-output
          path: |
            Plain Craft Launcher 2/bin/Release/*.exe
            Plain Craft Launcher 2/bin/Release/*.dll

      # 发布 Release
      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 自动构建 #${{ github.run_number }}
          files: Plain Craft Launcher 2/bin/Release/*.exe
