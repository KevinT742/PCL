name: 校验产物已打上补丁
description: 扫描编译出的 exe，确认「限制 MC 下载」的分支没有进到二进制里。补丁失效时直接失败，绝不发布

inputs:
  exe-path:
    description: 编译产物的路径（相对工作区根目录）
    default: 'Plain Craft Launcher 2\bin\Plain Craft Launcher 2.exe'

runs:
  using: composite
  steps:
    - id: verify
      shell: pwsh
      env:
        EXE_PATH: ${{ inputs.exe-path }}
      run: |
        $ErrorActionPreference = 'Stop'

        if (-not (Test-Path $env:EXE_PATH)) { throw "找不到编译产物：$($env:EXE_PATH)" }
        $bytes = [System.IO.File]::ReadAllBytes($env:EXE_PATH)
        Write-Host "扫描产物：$($env:EXE_PATH)  ($($bytes.Length) 字节)"

        function Test-Utf16Present([byte[]]$data, [string]$text) {
            $pat = [System.Text.Encoding]::Unicode.GetBytes($text)
            for ($i = 0; $i -le $data.Length - $pat.Length; $i++) {
                if ($data[$i] -ne $pat[0]) { continue }
                $ok = $true
                for ($j = 1; $j -lt $pat.Length; $j++) {
                    if ($data[$i + $j] -ne $pat[$j]) { $ok = $false; break }
                }
                if ($ok) { return $true }
            }
            return $false
        }

        # "关闭下载" 这个加载器名只出现在 `If RestrictMcDownload Then` 分支里。
        # RestrictMcDownload 是 Const，为 False 时该分支会被编译器当死代码整个丢掉，
        # 所以产物里不该出现这个字符串 —— 出现了就说明补丁没进到 exe 里。
        if (Test-Utf16Present $bytes '关闭下载') {
            throw '编译产物中仍存在 "关闭下载" 字样，说明 RestrictMcDownload 仍是 True，补丁没有进入 exe！拒绝发布。'
        }
        Write-Host '✅ 产物校验通过：不含 "关闭下载"，补丁已确实进入 exe'

        # 反向确认：开源版说明弹窗应当在（说明这是 OpenSource 分支的构建）
        if (Test-Utf16Present $bytes '该版本中无法使用以下特性') {
            Write-Host '  确认：这是 OpenSource 分支的构建'
        } else {
            Write-Host '  注意：产物中没有开源版说明弹窗的字样，请确认构建的是 OpenSource 分支'
        }
